<!DOCTYPE html>
<html lang="cs">



<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New York Počasí</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      background-image: url("https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      margin: 100px auto;
      padding: 30px;
      width: 80%;
      max-width: 500px;
      border-radius: 10px;
    }
    h1 {
      font-size: 40px;
    }
    #temperature {
      font-size: 50px;
      font-weight: bold;
    }
    p {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>New York Počasí</h1>
    <p id="description">Načítám počasí...</p>
    <div id="temperature">-- °C</div>
    <p id="details"></p>
  </div>

  <script>
    fetch("https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.0060&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=America%2FNew_York")
      .then(response => response.json())
      .then(data => {
        let weather = data.current;
        let conditions = {
          0: "Jasno",
          1: "Převážně jasno",
          2: "Polojasno",
          3: "Zataženo",
          45: "Mlha",
          48: "Mlha",
          51: "Slabé mrholení",
          53: "Mrholení",
          55: "Silné mrholení",
          61: "Slabý déšť",
          63: "Déšť",
          65: "Silný déšť",
          71: "Slabé sněžení",
          73: "Sněžení",
          75: "Silné sněžení",
          80: "Dešťové přeháňky",
          81: "Přeháňky",
          82: "Silné přeháňky",
          95: "Bouřka"
        };

        let condition = conditions[weather.weather_code] || "Neznámé počasí";

        document.getElementById("description").innerHTML =
          "Momentálně je v New Yorku:";
        document.getElementById("temperature").innerHTML =
          Math.round(weather.temperature_2m) + " °C";
        document.getElementById("details").innerHTML =
          "Počasí: " + condition + "<br>" +
          "Vlhkost: " + weather.relative_humidity_2m + " %<br>" +
          "Vítr: " + weather.wind_speed_10m + " km/h";
      })
      .catch(error => {
        document.getElementById("description").innerHTML =
          "Počasí se nepodařilo načíst.";
      });
  </script>
</body>
</html>
